[package]
name = "cosmic-applet-claude-usage"
version = "0.1.0"
edition = "2024"
description = "COSMIC panel applet showing Claude session and weekly usage limits"
license = "GPL-3.0-only"
repository = "https://github.com/farzodd/cosmic-applet-claude-usage"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "fs"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland", "winit"]

